<script>
/* =====================================================================
   HOW TO ADD ITEMS TO THE REGISTER
   Each item is ONE line inside the RAW block below (between the backticks).
   Fields are separated by the | character, in this exact order:

   CAT | NAME | EP | STATS | CLASS | MASS | LABEL | LABEL-VALUE | ROLE | FLAVOR | TWO-HANDED | TL | EXPERIMENTAL

   CAT    A = Armament tab, D = Defensive tab, U = Utility tab
   NAME   Display name. Items with the same name cannot be installed twice
          (except Armament, which allows duplicates). Tiered gear such as
          ECM/SENSOR SUITE reuses one name so only one tier can be taken.
   EP     Whole number cost.
   STATS  Space-separated LABEL:VALUE pairs. Use _ for spaces inside a value.
          Do NOT use spaces, commas, or the | character inside a pair.
          Example: ROF:5 DMG:6dx9(3) NOTE:needs_braced_stance
   CLASS  "GROUP // SUBTYPE". The text before // becomes the sub-heading in the
          menu (items with the same group are listed together), the text
          after it is shown beside the name. Keep related items adjacent.
   MASS   Flavor weight, e.g. 1.2 t
   LABEL  Name of the extra data field in the dossier (AMMO, POWER, FUEL...)
   LABEL-VALUE  The text for that field, e.g. 40mm HE, 20 rds
   ROLE   Short tactical-use text.
   FLAVOR One or two sentences of R+D notes.
   CAT may also be F (frame), T (thruster), R (reactor) or G (targeting): chassis components. A frame's EP is its base capacity.
   Frame STATS use ST/HP, DR, MOVE, SM, HND and SR tokens, e.g. ST/HP:120 DR:500/250 MOVE:9L/18S SM:+6 HND:+1 SR:1.
   For T / R / G For those, EP is a signed
   modifier to the frame's max EP (positive raises it, negative lowers it) instead of a cost.
   TWO-HANDED  1 = needs both arm stations, 0 = one-handed.
   TL     Tech level (whole number). All current records are TL 8.
   EXPERIMENTAL  1 = not yet playtested (shown as [EXPERIMENTAL]), 0 = vetted.

   Example line (copy, edit, paste it under the others in the same tab group):
   A|75mm LIGHT GUN|3|ROF:2 DMG:7dx8(3) AVG:196 ACC:5 RCL:3 RNG:2400/8000|BALLISTIC // LIGHT GUN|1.6 t|AMMO|75mm HE/AP, 30 rds|General support|A reliable middle-weight gun with a long service history.|0|8|0

   CHASSIS: stored as NAME, STAT LINE, EP CAPACITY, SUBTYPE (Mech or Vehicle).

   TIERED ITEMS (ECM/SENSOR style): put ONE line for the item here (its EP
   and stats are a summary), then add an entry to the TIER object below the
   register: NAME:[[EP,STATS,MASS,LABEL-VALUE,FLAVOR], ...one array per tier].
   The name must match exactly. Picking the item opens a tier submenu.

   Rules: one item per line, no blank lines, no line breaks inside an item,
   and do not use a backtick ` character in any field.
   ===================================================================== */
const RAW=`A|20mm LIGHT AUTOCANNON|2|ROF:10 DMG:6dx4(3) AVG:84(840) ACC:6 RCL:1 RNG:1800/7200|BALLISTIC // ROTARY AUTOCANNON|0.4 t|AMMO|20x110mm HEI/AP belt, 600 rds|Point defense, anti-infantry|The first thing they teach you is to lead the target. The second is to stop thinking of the rounds as individual shots. At combat rates, you're not shooting at a machine so much as painting a region of space with metal and asking the other pilot to make one mistake.|0|8|0|0
A|30mm AUTOCANNON|3|ROF:5 DMG:6dx9(3) AVG:189(945) ACC:4 RCL:2 RNG:113/458 AMMO:15(1)|BALLISTIC // CHAIN AUTOCANNON|1.1 t|AMMO|30x173mm APDS/HE, 15-rd belt box|Suppression, light armor killing|There is a satisfying finality to a thirty-millimeter impact. No warning tone, no shimmering barrier, no exotic energy signature for the analysts to argue about afterward. Just a tremendous noise, a shower of armor fragments, and a maintenance officer asking why the ammunition expenditure exceeds the mission allotment by six hundred percent.|0|8|0|0
A|45mm HAND CANNON*|3|ROF:3 DMG:9dx9(3) AVG:283.5(850.5) ACC:4 RCL:3 RNG:135/518 AMMO:9(1)|BALLISTIC // SEMI-AUTO HAND CANNON|2.3 t|AMMO|45mm AP/HE, 9-rd box|Mid-range anti-armor sidearm|You can tell when a pilot has started believing their own reputation. They stop closing distance, start posing for their gun cameras, and think the big gun makes them untouchable. Then someone with an ordinary rifle catches them between shots. A hand cannon is a wonderful tool. It is not a personality.|0|8|0|0
A|90mm HEAVY RIFLE|5|ROF:1 DMG:9dx15(3) AVG:472.5 ACC:4 RCL:4 RNG:150/500 AMMO:3(1)|BALLISTIC // LONG-BARREL RIFLE|4.8 t|AMMO|90mm APFSDS, 3-rd rack|Long-range hull breaking|A good rifle doesn't need to be impressive. It needs to do the same thing every time you pull the trigger. We built this one to punch through the front plate of a heavy chassis at a range where the other fellow is still deciding whether you're a sensor ghost. If you can keep the barrel steady, the rest is arithmetic.|1|8|0|0
A|60mm MISSILE POD|2|ROF:8 DMG:4dx12(4) AVG:168(1344) ACC:6 RCL:4 RNG:75/375 AMMO:8(1) SPARE:0 NOTE:+2_Active_Defense_vs_missiles|ROCKET/MISSILE // SALVO POD|0.6 t|AMMO|60mm fin-stabilized HE, 8 tubes, single salvo|Area suppression|The rookies love rockets because they can put a dozen little suns between themselves and the enemy, then call it marksmanship. The veterans love them for what comes afterward: the split formation, the broken rhythm, the instant when a proud ace must choose between holding their ground and living long enough to fight again.|0|8|0|1
A|80mm ROCKET LAUNCHER|3|ROF:2 DMG:5dx18(4) AVG:315(630) ACC:5 RCL:5 RNG:100/450 AMMO:2(1)|ROCKET/MISSILE // SHOULDER LAUNCHER|1.9 t|AMMO|80mm HEAT, 2-round magazine|Anti-armor, bunker busting|There is an art to forcing a knight from their chosen ground, and few tools are as honest about it as a well-placed salvo. The rockets need not kill the enemy; they need only make him turn, make him brake, make him abandon the perfect firing line he spent the last thirty seconds preparing.|0|8|0|0
A|120mm ROCKET CANNON|5|ROF:1 DMG:6dx30(4) AVG:630 ACC:5 RCL:6 RNG:150/750 AMMO:1(1) SPARE:4|ROCKET/MISSILE // ROCKET-ASSISTED CANNON|5.5 t|AMMO|120mm HEAT-MP, single round|Heavy anti-armor, missile intercept|No ace is foolish enough to stand still when a 120mm salvo paints the sky above them; the warning arrives, the thrusters flare, and the dance begins.|1|8|0|0
A|VIBROBLADE (LIGHT)|1|ROF:X DMG:64d(3) AVG:224|MELEE // VIBRATION BLADE|0.3 t|POWER|Hip cell, ~40 min|Close defense, cutting cable|Rookies trust the gun because it lets them kill a man without ever having to meet his eyes. A blade is different; it demands you understand your machine, your opponent, and the distance between their next breath and your next movement.|0|8|0|0
A|VIBROBLADE (MEDIUM)|2|ROF:X DMG:76d(3) AVG:266|MELEE // VIBRATION BLADE|0.9 t|POWER|Back cell, ~25 min|Dueling, hull cutting|A rifle lets you fight the enemy you see; a blade forces you to feel the enemy you face. Every movement carries intent, every clash tells a story, and somewhere between the first parry and the final cut, the machine ceases to be steel and servo and becomes an extension of the soul.|0|8|0|0
A|VIBROBLADE (HEAVY)|3|ROF:X DMG:88d(3) AVG:308|MELEE // VIBRATION BLADE|2.1 t|POWER|Backpack cell, ~12 min|Anti-armor melee, breaching|Nobody sensible wants to duel a heavy blade. The weapon is too expensive, the risk is too great, and there are a dozen more efficient ways to destroy a chassis. Unfortunately, battlefields are not arranged by sensible people. Someone will always run out of ammunition, lose a weapon arm, or decide that getting close is preferable to being shot at from across a kilometer.|1|8|0|0
A|PILE BUNKER|4|ROF:X DMG:10dx15(4) AVG:525 AMMO:1(1) SPARE:4 NOTE:charge_one_turn_before_firing_1_heat_cost_one_cartridge_reload_after_each_shot|MELEE // PILE BUNKER|3.6 t|AMMO|1 pile cartridge, reload after each shot|Armor-piercing breaching, single-strike limb removal|A pile bunker is not a duelist's weapon. It is a decision made one turn in advance and paid for in full the moment it lands. The charge whine tells everyone on the field what is coming, and the pilot who wastes it learns how long a reload takes with an enemy still standing. The pilot who connects does not need a second shot.|0|8|1|0
D|SMALL SHIELD|2|DR:160/60 HP:40|SHIELD // FOREARM BUCKLER|0.5 t|MATERIAL|Ceramic-steel laminate|Light fire, shrapnel|A shield is not supposed to stop everything. That's a child's understanding of the word. Its job is to turn the one shot you couldn't dodge into the one shot you can survive. If you come back with a shattered shield and an intact cockpit, it has performed admirably.|0|8|0|0
D|MEDIUM SHIELD|3|DR:180/90 HP:160|SHIELD // HAND-HELD PLATE|1.4 t|MATERIAL|Ceramic over titanium|Cover and parrying|The first time I took a direct hit on the shield, I thought the cockpit had split open. Every alarm went off at once, and the whole frame slewed sideways hard enough to throw up my dinner. Then the damage report came in. Minor actuator strain, shield integrity down forty percent, pilot condition stable. I started laughing. Couldn't stop for nearly a minute.|0|8|0|0
D|LARGE SHIELD|5|DR:200/120 HP:300|SHIELD // KITE BULWARK|2.9 t|MATERIAL|Layered ablative plate|Advancing cover, rocket soak|For all the arguments about maneuverability, thrust-to-weight ratios, and the superiority of the first strike, the large shield remains one of the few pieces of equipment whose value can be demonstrated with a single photograph: the pilot standing beside a wrecked machine, helmet under one arm, looking confused about still being alive.|0|8|0|0
D|TOWER SHIELD|7|DR:240/180 HP:500|SHIELD // DEPLOYABLE WALL|5.2 t|MATERIAL|Spaced plate, hydraulic stands|Holding chokepoints|The unit commander ordered us to advance behind the shield line, and for the first time that morning I felt safe. Not confident. Not brave. Safe. The machines moved forward through a hail of fire, their shields grinding sparks from the concrete, and we followed in their shadow. I used to think of courage as moving toward danger. That day I learned it could also mean having something between you and it.|0|8|0|0
D|REINFORCED ARMOR|3|DR:+10% NOTE:does_not_stack_with_other_percent_armor|ARMOR // APPLIQUE PLATING|+1.2 t|MATERIAL|Bolt-on steel-ceramic plates|Passive survivability|Every additional plate brings a compromise. Mass, actuator load, thermal retention, maintenance hours. The sales brochure calls this package a survivability enhancement, which is accurate in much the same way that a bunker is a survivability enhancement. The question is whether your frame can still get to the fight before the enemy finishes it.|0|8|0|0
D|SPACED ARMOR PANELS|2|EFFECT:+1_armor_divisor_step_vs_shaped_charge/rockets NOTE:no_effect_vs_kinetic_or_beam|ARMOR // STAND-OFF PANELS|+0.9 t|MATERIAL|Thin skin on stand-off rods|Defeat rockets|Shaped charges are ingenious things. They take a small amount of explosive and ask geometry to do the rest. Spaced armor answers with a rather unscientific objection: the jet does not get to arrive at the target in the condition its designers intended. Against kinetic penetrators, it offers considerably less consolation. Engineering is full of such compromises.|0|8|0|0
D|SACRIFICIAL PLATING|4|PLATE:25 PLATE-USES:1 PLATE-HP:full NOTE:ablative_tiles_one_use_per_component|ARMOR // ABLATIVE TILES|+0.3 t|MATERIAL|Ceramic tile packs|Limb protection|The panel did exactly what it was designed to do. It broke apart, distributed the impact, and gave up its entire existence to save the arm underneath. The pilot called it a lucky hit. The maintenance chief called it a replacement order. Both were right, and the arm was still attached.|0|8|0|0
D|COUNTERMEASURE POD|2|EFFECT:1/round_negate_attacker_ACC_bonuses NOTE:base_skill_unaffected|ECM // CHAFF AND JAMMER POD|0.4 t|POWER|Capacitors + chaff cassette|Break lock-ons|The pod buys you one attack's worth of confusion. That's it. No magical invisibility, no permanent bubble of safety, no guarantee that the next missile will miss. Just a brief interruption in the enemy's certainty at precisely the moment they were counting on it. In the hands of a good pilot, that is enough. In the hands of a bad one, it's an expensive way to be surprised twice.|0|8|0|0
U|FOOT ROLLERS|1|MOVE:+50%_land_on_flat/paved NOTE:-1_SR_on_rough NOTE:not_while_prone|MOBILITY // HEEL ROLLERS|0.5 t|POWER|Hub motors, 30 min|Road and airfield dashes|It looks ridiculous until you've watched a light frame cross a kilometer of paved industrial road before the enemy has finished setting up their firing positions. Then it looks ridiculous and effective, which is a category of military equipment the procurement officers have never fully understood.|0|8|0|0
U|ROCKET BOOSTERS|2|MOVE:+50%_for_1_turn NOTE:ignore_terrain COST:1_FP/turn_or_heat DEF:-1_next_defense|MOBILITY // BOOSTER PACK|0.8 t|FUEL|Solid cartridges, 3 burns|Close or break away|Boosters don't make you faster. They make you fast at a time when you desperately need to be. The trick is remembering that momentum has a price, heat has a price, and the enemy gets a vote in what happens when you finish your burn. Every rookie wants to fly. Every veteran wants to know where they'll be when the thrust runs out.|0|8|0|0
U|JUMP JETS (SHORT)|2|JUMP:up_to_1/2_MOVE NOTE:Piloting_roll_to_land_cleanly|MOBILITY // VERNIER JETS|0.7 t|FUEL|Hydrazine, ~8 jumps|Hop, flank, escape|There is a special kind of silence just after a jump, when the ground has fallen away and your frame is committed to a trajectory you can no longer alter with your feet. For a moment, the alarms, the radio, the gunfire, all of it seems to vanish. Then the landing computer starts screaming at you, and you remember that gravity has been waiting patiently the whole time.|0|8|0|0
U|ENHANCED TARGETING SUITE|2|ACC:+2_ranged NOTE:lost_if_head_or_sensors_disabled|TARGETING // OPTICS PACKAGE|0.2 t|POWER|Sensor battery in head|Better hit chance|There is a persistent misconception that a targeting computer makes a mediocre pilot dangerous. It does not. What it does is remove a handful of small, stupid errors between deciding to shoot and putting a round through the part of the enemy that matters. At the highest levels, a handful of small, stupid errors is the difference between an ace and a casualty statistic.|0|8|0|0
U|FIRE CONTROL LINK|1|EFFECT:ignore_ROF_recoil_penalties_up_to_RCL_2 NOTE:one_weapon_per_turn|TARGETING // RECOIL HARNESS|0.1 t|LINK|Bus to one weapon|Steady rapid fire|Recoil is predictable. That is the whole point of the system. Your weapon kicks, the frame compensates, the next firing solution is calculated, and the cycle repeats. Unfortunately, your opponent is not predictable, your footing may be terrible, and the arm you're using to mount a weapon that weighs as much as a transport vehicle has already taken two hits. Technology is wonderful. It is not a substitute for knowing when to stop shooting.|0|8|0|0
U|STABILITY GYROS|1|SR:+1_firing_heavy_or_sustained_weapons|TARGETING // TORSO GYROS|0.6 t|POWER|Flywheel pair|Heavy recoil|You don't notice the gyros when they're working. You notice them when they aren't. The sights wander, the frame leans into the recoil, and the whole machine begins to feel like it's standing on a moving deck. Then you realize the gyro warning has been blinking for thirty seconds, and the last time you saw a maintenance window was four sorties ago.|0|8|0|0
U|ECM SUITE|2|TIERS:3 RADIUS:50/250/500m DETECT:-4/-8/-12 EFFECT:suppresses_sensor-based_ACC_bonuses|EW // ECM SUITE|0.3-1.6 t|POWER|2-6 kW jammer array|Blind enemy sensors|The first casualty of electronic warfare is certainty. Your sensors report an empty street, your targeting computer insists something moved through your blind spot, and command wants to know why you haven't engaged the hostile that everyone else can apparently see. You begin to understand that the battlefield is not what you observe. It is what you can prove.|0|8|0|0
U|SENSOR SUITE|3|TIERS:3 RADIUS:250/500/750m CHECKS:+2/+4/+6 EFFECT:half_sensor_ACC_vs_ECM NOTE:full_if_higher_tier_than_ECM|EW // SENSOR SUITE|0.3-1.4 t|POWER|3-7 kW sensor array|See through jamming|We had a clean return, full profile, heat signature, estimated mass, the lot. For about three seconds, we were very pleased with ourselves. Then the enemy switched on their countermeasures and our beautiful picture dissolved into a thousand plausible lies. The lesson isn't that sensors are useless. It's that knowing something is there and knowing what it is are two very different military achievements.|0|8|0|0

const tgtTotal=()=>rngPen(effRng())+sitAtk()+sizeMod()+(pNum('mod')||0)+rofBon(rofEffNow());
function togRetreat(on){S.pilot=S.pilot||{};S.pilot.ret=on?'1':'0';audioEvent(on?'ok':'panelClose');pilotLive();note('[ -- ] RETREAT '+(on?'ENGAGED :: +3 TO DODGE, +1 TO PARRY / BLOCK / TURN BLOW':'DISENGAGED'),on?'ok':'dim','RETREAT')}

const CHANGELOG=[
{v:'5.3.0',items:['Reverted the v5.1 font and the HUD sortie header: original Consolas stack and sizes, one-line readout. Full-health paper doll back to the theme color (slightly desaturated).','Removed the RAD tracker from the pilot box.','Items: right-click for Info and the hand/station (the dropdown is gone). Left-click a weapon to open its targeter and All-Out Attack; the targeter RoF max is that weapon\'s ROF.','All-Out Attack is one button in the targeter (right-click for the type, only types valid for the weapon). DEFENSE and ALL-OUT DEFENSE buttons are in PILOTING (right-click for the type). Retreat gives +1 to Parry, Block and Turn Blow.','Console: commands start with / (for example /undo, /mp whoami); anything else is chat to the table in your seat color. Each roll is one line (user / frame / action / result) that expands on click or Enter. No timestamps, no CLEAR/COPY LOG buttons, no hint text under the command line.']},
{v:'5.2.1',items:['Fixes: the hit count from an attack is kept with the sheet, so a live-table sync or a refresh no longer loses it; [DMG] refuses after a miss and after the hits are rolled.','The targeter RoF is capped at the weapon ROF for rounds, hits and the RoF to-hit bonus.','Melee-only All-Out Attack options are greyed out without a held melee weapon; the active choice shows in the sortie readout.','MP RESET-LOCAL and MP RESYNC send pending changes first and ask for confirmation; an oversized update is reported, trimmed and retried with backoff. VENT tooltip corrected.']},
{v:'5.2.0',items:['Sheet tabs: right-click a tab (or focus it and press Shift+F10 / the Menu key) for its actions with full labels: rename, duplicate, close, hold/deploy, assign. Escape closes the menu.','DEFENSE // ALL-OUT ATTACK: Dodge (with Retreat), Turn Blow, Parry and Block are grouped in one section under the targeter. All-Out Attack is one choice per turn (Determined, Double, Feint, Strong, Long, Suppression Fire at RoF 5+); Determined feeds the attack SL, Strong adds to melee damage, and any option shows NO ACTIVE DEFENSE.','Attacks: a hit now records 1 + degrees of success (margin / Recoil), capped at the rounds fired; [DMG] rolls that many damage rolls.','Core to-hit is +0, and disabled arms or legs no longer add a bonus.','Vent: at least 1 heat on a failed roll and at least 2 on a success.','More hover tooltips on buttons. Live table: a seat that cannot write to its unit is told so; console MP WHOAMI, MP RESYNC and MP RESET-LOCAL.']},
{v:'5.1.0',items:['Readability and status: JetBrains Mono with symbol fallbacks, one amber for DMG/WARN and one red for CRIT in every theme (AA contrast), text cues next to colour, segmented gauges that keep the exact numbers.','Sortie readout: the telemetry header is a compact HUD (status, integrity, heat, link state). A new crit gives a short red edge pulse once (outline only under reduced motion).','Section headers are keyboard-operable and show CRIT/OFFLINE badges when collapsed. Paper-doll locations are keyboard-operable.','Catalogue: sticky search box, press / to focus it.','Console: timestamps; an undone action is struck through and the UNDO line stays.','Audio is muted until you turn it on (remembered). The boot sequence plays once per browser session.','Pilot RADS (GURPS B435): one number on the pilot record with +/- buttons, a band tag and a log line, plus one-click Oleum Vis sortie and Purge Valve doses when those parts are fitted.','BRITTLE frames (MUSHA): the token is kept and shown as a tag; below half Core HP the frame loses the listed SR automatically. Colon-form frame statlines in manifests are read correctly.','Live table: remote console lines are sanitised, unsent edits survive polls and conflicts, undo no longer discards queued hits, link states and [RE-AUTH] after the table closes, backoff and slower polling in background tabs, no seat is taken on the login screen, and only the host can clear the shared console.']},
{v:'5.0.1',items:['Manifest intake is now release-tolerant: unknown chassis/equipment records and alternate EP/stat blocks are retained rather than rejecting the whole sheet. The imported sheet displays a catalogue compatibility audit, and incompatible flight-recorder tables are skipped with a warning instead of blocking the load.','Compiled frame manifests now identify the FORGE-OS sheet-export version that created them.']},
{v:'5.0',items:['Catalogue editor: EP COST now accepts 0 and negative whole numbers for every record type and for every tier. Before, negatives were refused for armament, defensive, utility and frame records and for all tier records. A negative EP gives capacity back to the EP bus.','Catalogue editor: clicking EDIT, COMMIT RECORD or DISCARD DRAFT no longer reloads the registry list. The list swaps in place and keeps its scroll position, so there is no more rescrolling after every edit.','Catalogue editor registry: the old CHASSIS tab is now KNIGHT FRAME (knight frames plus reactor, thruster and targeting systems, shown as separate sections). A new CHASSIS tab holds two categories: VEHICLES and GC (General Chassis) mechs. New [ADD VEHICLE] and [ADD GC CHASSIS] buttons pre-fill the correct category, and typed K opens Knight Frame while C opens Chassis.',
 'Manifests: armament, defensive and utility records with a negative EP now save and load correctly. The loader used to skip them silently.']},
{v:'4.9.8',items:['Knight frame component balancing pass. Versions 4.9.6, 4.9.7 and 4.9.8 were successive iterations on knight frame component balancing.']},
{v:'4.9.7',items:['Knight frame component balancing pass. Versions 4.9.6, 4.9.7 and 4.9.8 were successive iterations on knight frame component balancing.']},
{v:'4.9.6',items:['Knight frame component balancing pass. Versions 4.9.6, 4.9.7 and 4.9.8 were successive iterations on knight frame component balancing.']},
{v:'4.9.5',items:['Knight frame rework: frames carry all base stats again (ST/HP 110/120/130, DR, MOVE 13L/25S, 9L/18S, 6L/12S, SM, HND +1, SR 1). Reactors now modify ST/HP by a percentage (+30%, +40%, +50%) and thrusters modify MOVE by a percentage (+10%, +20%, +30%); HEAT, VENT, HND, SR and DR stay plain numbers. Percentages round to whole numbers.','Handling and stability are split between frame, reactor and thruster, with 0 (no token) where there is not enough to go around: a full Light loadout totals HND/SR +3/1, Medium +2/2, Heavy +1/3. Matched loadouts: Light 143 ST/HP 14L/28S, Medium 168 ST/HP 11L/22S, Heavy 195 ST/HP 8L/16S.']},
{v:'4.9.4',items:['Knight rebalance: frame move penalties grow with size (Light -4L/-8S, Medium -9L/-18S, Heavy -15L/-30S) and thrusters were raised to match (Lightweight +18L/+36S, Standard +20L/+40S, Sprint +23L/+46S). Matched loadouts are now Light 14L/28S, Medium 11L/22S, Heavy 8L/16S. Matched Light, Medium and Heavy loadouts total HND/SR +3/1, +2/2 and +1/3.','Reactors and thrusters are down to three each (Assault Fusion Core and Precision Thrusters removed). Every frame, reactor and thruster now grants EP and larger or stronger parts grant more: thrusters +1/+2/+3, reactors +2/+4/+5, frames +2/+5/+9. The Light Fission Cell is 145 ST/HP.','General Chassis ST/HP is now Light 130, Medium 155, Heavy 185.','Close-Quarters and Sniper targeters merged into one AUTOTARGETER with a mode choice (EP and bonuses unchanged per mode). Fire Control Suite renamed Linked Fire Control Suite.','Chassis tabs reordered General Chassis, Vehicle, Knight Frame, and General Chassis is the default tab.']},
{v:'4.9.3',items:['All grey header text crawls now scroll one way and wrap onto themselves in a continuous loop. The minimised Skill Inputs summary crawls too.','Thrusters: Lightweight (renamed from Heavy-Lift), Standard (renamed from Vernier), Precision (now EP -1), Sprint, in that order. Thrusters carry MOVE, HND and SR again (Lightweight SR+0, Standard +1, Precision +2, Sprint -1). Frames carry HND again (Light +2, Medium +1, Heavy +0) with SR trimmed by 1 to compensate.','Chassis registry: the modular mech page is now KNIGHT FRAME, and a new GENERAL CHASSIS tab sits after VEHICLE. General Chassis entries (Light, Medium, Heavy) are non-modular mechs about 10% weaker than the matching Knight Frame with standard parts; they carry their own EP, HEAT and VENT.']},
{v:'4.9.2',items:['Shoulder-fireable toggle (like Two-Handed) in the catalogue editor, shown as [SHOULDER] in the catalogue and dossier. A shoulder-fireable weapon can attack from the left or right shoulder mount, not only from a hand. The 60mm Missile Pod has it. Character sheet stat blocks now start with 2H and/or SLDR where they apply, and AMMO/SPARE are hidden from telemetry statlines because the boxes already show them.','Weapon ranges are now one twentieth of their original values, rounded: 30mm 113/458, 45mm 135/518, 90mm 150/500, Missile Pod 75/375, Rocket Launcher 100/450, Rocket Cannon 150/750. Range bands are 1-9 close, 10-18 medium, 19+ far.','Mech component rebalance around a medium frame with standard parts at 11L/22S (Light 13L/26S, Heavy 9L/18S). Frames carry DR, SR and a negative MOVE; reactors carry ST/HP, HEAT and VENT; thrusters carry MOVE and HND; targeting is unchanged. Thrusters cut from 7 to 4: Heavy-Lift, Precision, Vernier, Sprint.','New Fast Draw (Ammo) skill input. Reloading with it entered rolls it: a success makes the reload free, a failure takes the weapon reload time. With it blank, a reload simply takes the normal reload time.']},
{v:'4.9.1',items:['Ammo: new AMMO:mag(reload seconds) and SPARE:n stat tokens. All ranged weapons now carry a magazine (at most 3 rounds of full-RoF fire), 2 spare magazines by default; the 60mm Missile Pod has none, the 120mm Rocket Cannon and Pile Bunker carry 4 spare. All reloads take 1 second for now.','Telemetry weapon rows: the EP cost and drag handle are hidden to make room for editable current-ammo and spare-magazine boxes (2 digits) and an [R] reload button. Each attack roll spends rounds equal to the targeter RoF; at 0 rounds the attack buttons become an orange [AMMO] (a melee parry stays available, and a damage roll for the shot just fired is still allowed). New tick, empty-click and reload sounds. Ammo is saved in the ISB flight recorder.','60mm Rocket Pod renamed 60mm Missile Pod: RoF 8, 8-round magazine, and it takes the +2 Active Defense vs missiles note from the 120mm Rocket Cannon. 80mm Rocket Launcher RoF is now 2 with a 2-round magazine; the 120mm is single shot.','Rocket weapons are now the ROCKET/MISSILE group (skill and fire-control bonuses follow the new name). Weapon ranges rescaled to the 120mm Rocket Cannon 20/100 (all others divided by 150, rounded).']},
{v:'4.9.0',items:['New armament: PILE BUNKER (melee, one-handed, 4 EP, 10dx15 with armor divisor 4). Charge one turn before firing, 1 heat cost, holds one cartridge and must be reloaded after each shot. Flagged experimental until playtested.','Mech size modifiers retuned: Light and Medium frames SM+6, Heavy frame SM+7.','EP costs: Sacrificial Plating 4, Reinforced Armor 3 (Spaced Armor Panels stay at 2).']},
{v:'4.8.9',items:['Catalogue editor: token reference descriptions sit on their own full-width line, the Stats box is now the same size as Engineering / Field Notes (line breaks are folded to spaces on commit), and the cost label is just EP COST.']},
{v:'4.8.8',items:['Armor and plating are now stat-driven for any catalogue item: DR:+N% raises all frame DR (largest percentage wins), and PLATE:N with optional PLATE-USES:n and PLATE-HP:full|any makes any item sacrificial plating. Reinforced Armor and Sacrificial Plating were converted to the tokens.','Catalogue editor: load-bearing fields (name, stats, type, subtype, cost, tech level, experimental, two-handed) are grouped in a collapsible section, flavor text fields in another, with a collapsible STAT TOKEN REFERENCE at the top. Click a [+] example to append it to the Stats box; a live check under Stats flags malformed or unrecognised tokens.']},
{v:'4.8.7',items:['Repair on a component already at full HP, or Repair All, now replaces expended sacrificial plating. The [R] stays on the first line of the tile.','Damage that penetrates now plays an impact sound.','Reinforced Armor now actually raises the frame DR (+10% on both DR values, rounded) everywhere DR is shown or used.','Sacrificial Plating: the first penetrating hit on a component at full HP deals 25% less damage after armor (rounded up), then the plating on that component is expended. Plated components show [R] to the right of their status on the paper doll; it turns red and struck through once expended. Expended state is covered by undo and flight-recorder save/load.']},
{v:'4.8.6',items:['Accuracy toggle is now an ACC button at the left of the fire control line under the targeter (the header checkbox is gone). When on, each ranged weapon chip on that line adds its own ACC, and the affected numbers turn gold.']},
{v:'4.8.5',items:['Target size modifier is now half the SM difference, rounded up (away from zero): SM+8 vs SM+9 = +1, vs SM+4 = -2, vs SM+5 = -2.','Targeter header checkbox label now reads Accuracy.']},
{v:'4.8.4',items:['Mech size modifiers: Light and Medium frames are now SM+8, Heavy is SM+9.','Targeter: new TARGET SIZE tile (where the Accuracy button was). Leave it empty for no modifier; otherwise the to-hit modifier is target SM minus your SM (SM+8 vs SM+9 = +1, vs SM+4 = -4). It applies to attack rolls and the targeter total. The Accuracy toggle is now an ACC checkbox in the targeter header, left of TOTAL MOD, keeping the 3 x 2 layout.']},
{v:'4.8.3',items:['Sheet section headers: the grey component list now slowly crawls so cut-off items scroll into view, and the item total sits at the far right of each header.','Frames renamed Light Frame, Medium Frame and Heavy Frame (TL8- prefix removed). Older manifests with the old names still load.','Exported character sheet chassis line now shows the frame EP, e.g. [EP +5] MEDIUM FRAME.']},
{v:'4.8.2',items:['Removed the UI zoom button and setting.','Skill MOD box now sits on the skill inputs header line and stays visible when the section is collapsed. The collapsed summary is compact (PIL14 SEN14 EW14) and skips unset skills.','Console has two sizes, switched with the [+]/[-] minimize and maximize button (or by clicking the ticker): a two-line ticker, and a medium size about twice the ticker panel. The choice is remembered.','Heat section reformatted: line 1 is the heat bar with the status written inside it and the condition effects to its right; line 2 holds the [-5][-1][+1][+5] tickers and the Vent button. Fixed a layout rule that had squeezed the bar to nothing.','Removed the roll-result badge next to buttons (it was not working reliably).','An item must be in a hand (left, right or both) to attack, deal damage, parry or block on a mech; shoulder-stowed and uninstalled items cannot roll.','Picking an occupied mount in the dropdown now swaps the two items (when the swap is legal) instead of being blocked.','Sheet section headers list their components in grey (Chassis: frame, reactor, thruster, targeting; Armament / Defense / Utility: item names).']},
{v:'4.8.1',items:['Readability: three-size type scale with a 12px floor (11px only for decorative labels), tabular figures for numbers, and redundant non-color cues (glyphs on targeter chips, striped heat bar in the danger zone and redline).','Less scrolling: skill inputs collapse to a one-line summary (PIL 14 · SEN 14 · EW 14 · ENG 14); the console docks as a one-line ticker with an expand/minimize toggle; section, console and scale state are remembered between sessions.','Consistency: one control style for buttons, selects, inputs and checkboxes (same height, border, hover and focus ring); a 4px spacing scale and named semantic colors; one header treatment with the [-]/[+] always first.','Impact Resolution: the damage field is focused automatically, Enter applies, and the last DIV is kept. RNG, SPD, RoF and MOD have themed - / + steppers and mouse-wheel adjust.','Feedback: the last roll result appears beside its button for a few seconds; hovering any SL shows how it was built; undo shows a toast; roll lines in the console are color-coded and have a copy button; the console has COPY LOG and CLEAR.','Accessibility: UI scale setting (90 / 100 / 110 / 125%) in the header.','Under the hood: derived chassis stats are computed once and reused; old chassis editor and chassis drag-and-drop code removed.','Changelog: x.x versions are dropdowns with x.x.x sub-dropdowns instead of tabs.']},
{v:'4.8',items:['Exported manifest: the CHASSIS section is a single section again. It lists the frame with its base statline, then each system as [EP] NAME with its own stats, with no divider lines between them. Manifests from 4.7.x and 4.7.5 still import.','Naming step asks for Frame ID and Frame Model (replacing callsign). The chassis line on the character sheet uses the Frame Model as its name.','Character sheet chassis line shows VENT (not VENT STEP).','Changelog is now split into tabs by x.x version (4.8, 4.7), with each version collapsible inside its tab.']},
{v:'4.7.5',items:['Heat: the DANGER ZONE / REDLINE label now has its effects beside it in compact form (.75DR/+1DOD/+1MOV in the danger zone, .5DR/+2DOD/+2MOV at redline), in fixed slots so nothing shifts.','Vent: the reactor vent stat is now the step size for degrees of success instead of a flat amount. A bare success vents 1 heat, plus 1 more per vent-sized step of margin (SL 12, roll 9, vent 3 = margin 3 = 1 + 1 = 2). A lower vent number is therefore better. The button reads [VENT /n].','Exported manifest: the CHASSIS section now lists FRAME, REACTOR, THRUSTER and TARGETING by name (tier and space-rated shown as a marker) with only the aggregate statline beneath. Import resolves the components by name and checks the aggregate. Older manifests still load, including v4.6 standard builds.','Size modifiers: Light and Medium frames are now SM +4, Heavy is SM +5, vehicles are unchanged.']},
{v:'4.7.4',items:['Catalogue and frame setup: clicking an item now adds it; the [INFO] button is the only way to open its dossier. The [ADD TO MECH] buttons are gone (tiered items still ask for their tier or sub-choice first).','Frame is now a normal catalogue record, with the same fields, dossier, editor, TL and Experimental flag as Reactor, Thruster and Targeting.','Chassis on the sheet fills in as soon as any component is picked, even before a frame is chosen. Expanded, it shows the aggregate statline first, then each component.','Targeter: cells are one row shorter, the range band sits on the RANGE header line, and speed now shows its own gold modifier like range and RoF. The accuracy toggle is compact.','Retreat is now a checkbox beside Dodge instead of a button.','Heat: DANGER ZONE / REDLINE is shown to the right of Vent and SL in a fixed slot, so the rows no longer shift when conditions change.','Impact Resolution: REAR and GAP use the themed checkboxes.','The version number in the header opens this changelog.']},
{v:'4.7.3',items:['Catalogue rows gained [ADD TO MECH] and [INFO] buttons; Fire Control Suite became one tiered entry with a weapon-specialisation sub-choice.','Space-rated is now a toggle on any thruster that costs 1 EP; the Space-Rated Array entry was removed.','Thruster DR removed and moved into frames and reactors; reactor Move removed; Move values across the catalogue cut to a third. Standard builds are Light 6L/12S, Medium 5L/10S, Heavy 4L/8S.','Chassis components are ordered Frame, Reactor, Thruster, Targeting.','Heat: danger zone cuts DR by 25%, redline (formerly overheat) by 50%; heat controls moved into the Engineering section.','Targeter notes the targeting-system bonus that currently applies per weapon; range bands are 0-4 close, 5-12 medium, 13+ far.']},
{v:'4.7.2',items:['Frame, thruster, reactor and targeting dossiers can be opened during frame setup, and the sheet fills in as you choose.','Targeter header shows a single total modifier; Retreat moved beside Dodge; stability check sits on the penetration line; vent button shows base vent plus degrees of success.','Degrees of success are increments of 1 on non-recoil rolls and failure uses SR; recoil rolls use recoil for success and 1 for failure.','Targeting systems reworked (range-banded Close-Quarters and Sniper, weapon-class Fire Control Suites); reactors carry SR, heat and vent.']},
{v:'4.7',items:['Chassis now installs a reactor, thruster and targeting system on top of the frame; EP is a capacity modifier.','Heat pool with danger zone and redline, vent action, and stability check on large hits.','Every sheet section collapses; Situation Mods became the Targeter section; console UNDO command; TL and Experimental fields on all components.']}
];
const logKey=v=>v.split('.').slice(0,2).join('.');
function logHTML(){const g=[...new Set(CHANGELOG.map(e=>logKey(e.v)))];
 return`<div class=clogbox><div class=clogh><b>FORGE-OS // CHANGELOG</b><button type=button onclick="openLog()">[CLOSE]</button></div>`+g.map((k,gi)=>{const list=CHANGELOG.filter(e=>logKey(e.v)==k);return`<details class=lg1 ${gi==0?'open':''}><summary>v${k}.x <span class=dim>// ${list.length} release${list.length==1?'':'s'}</span></summary>`+list.map((e,i)=>`<details class=lg2 ${gi==0&&i==0?'open':''}><summary>v${e.v}${e.v==CHANGELOG[0].v?' <span class=dim>// latest</span>':''}</summary><ul>${e.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`).join('')+`</details>`}).join('')+`</div>`}
function openLog(){let o=document.getElementById('clog');if(o){o.remove();audioEvent('panelClose');return}o=document.createElement('div');o.id='clog';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Changelog');o.onclick=e=>{if(e.target===o)openLog()};o.innerHTML=logHTML();document.body.appendChild(o);audioEvent('panelOpen')}

/* ===== v4.8.1 UI layer ===== */
const LOGCAP=160,UIKEY='forge_ui_v1';let UI={sh:{},cs:0};
try{const j=JSON.parse(localStorage.getItem(UIKEY)||'null');if(j&&typeof j=='object')UI=Object.assign(UI,j);if(!UI.sh||typeof UI.sh!='object')UI.sh={};UI.cs=UI.cs>=1?1:0}catch(e){}
function toggleCon(){UI.cs=UI.cs?0:1;applyUI();uiSave();audioEvent(UI.cs?'panelOpen':'panelClose');const l=$('log');if(l)l.scrollTop=l.scrollHeight}
function uiSave(){try{localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}}
function applyUI(){const c=$('cb');if(c){c.classList.remove('cs0','cs1');c.classList.add('cs'+UI.cs)}const m=$('conmark');if(m)m.textContent=UI.cs?'[-]':'[+]'}
function toast(m){let t=document.getElementById('toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>{if(t.parentNode)t.remove()},3200)}
function copyText(t,msg){const done=()=>toast(msg);try{navigator.clipboard.writeText(t).then(done,()=>{throw 0})}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();done()}}
function copyLog(){copyText(Array.from($('log').children).map(d=>d.textContent.replace(/\[CPY\]/g,'').replace(/\s+$/,'')).join('\n'),'Console log copied')}
function clearLog(){$('log').innerHTML='';toast('Console cleared')}
function copyLine(b){copyText(b.parentNode.textContent.replace('[CPY]','').trim(),'Roll line copied')}
const _mm={};function memo(n,k,f){const m=_mm[n];if(m&&m.k===k)return m.v;const v=f();_mm[n]={k,v};return v}
function stepVal(i,d){const st=+i.dataset.step||1,mn=i.min!==''?+i.min:-Infinity,mx=i.max!==''?+i.max:Infinity;let v=(parseFloat(i.value)||0)+d*st;v=Math.min(mx,Math.max(mn,v));i.value=+v.toFixed(2);i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))}
function stepIn(b,d){const i=b.parentNode.querySelector('input');if(i)stepVal(i,d)}
function focusDefault(){const t=(S.view=='sortie'&&$('dmgIn'))?$('dmgIn'):($('pw')||$('researchPw')||$('mpname')||$('CI'));if(t){t.focus();if(t.id=='dmgIn')try{t.select()}catch(e){}}}
function pgSum(g){const P=S.pilot||{},rows=[['PIL','pil'],['SEN','sen'],['EW','ew'],['ENG','eng'],['FD','fd'],...[...g].map(([k,l])=>[l.slice(0,3).toUpperCase(),k])].filter(([n,k])=>P[k]!==''&&P[k]!=null);return rows.length?rows.map(([n,k])=>n+P[k]).join(' '):'no skills entered'}
function slBreak(spec){const[t,k,wi]=spec.split('|'),b=pNum(k);if(b==null)return'enter the base skill first';const w=wi!==undefined?weapons()[+wi]:null,mod=pNum(k.startsWith('w_')?'mod':'smod')||0,hn=chStats().hnd,p=[];
 if(t=='def'||t=='dod')p.push('skill '+b+' halved = '+Math.floor(b/2),'HND '+sg(hn));else if(t=='hnd')p.push('skill '+b,'HND '+sg(hn));else p.push('skill '+b);
 if(mod)p.push('MOD '+sg(mod));
 if(t=='dod'){if(sitDef())p.push('RETREAT '+sg(sitDef()));if(heatDodge())p.push('HEAT '+sg(heatDodge()))}if(t=='def'&&pNum('ret')==1)p.push('RETREAT +1');if((t=='dod'&&aodBon('dod'))||(t=='def'&&aodBon(kindOfK(k))))p.push('ALL-OUT DEFENSE +2');

function rcNew(a,r,o,d){const w=rcWho();let f='';try{f=idline()}catch(e){}return{id:rcId(),u:w.u,c:w.c,f,a,r,o,d}}
function rcSum(rc){return`<span class=rcu style="color:${colOk(rc.c)||'var(--cyan)'}">${esc(rc.u)}</span><span class=dim> / </span><span class=rcf>${esc(rc.f)}</span><span class=dim> \u00b7 </span><span class=rca>${esc(rc.a)}</span><span class=dim> \u00b7 </span><b class=rcr>${esc(rc.r)}</b>`}
function rcHtml(rc){return`<div class="rc ${safeT(rc.o)}" data-rcid="${esc(rc.id)}" tabindex=0 role=button aria-expanded=false title="Click, Enter or Space: show the individual rolls">${rcSum(rc)} <span class=rcx aria-hidden=true>[+]</span></div>`}
const safeT=o=>['ok','bad','warn','dim'].includes(o)?o:'dim';
function rcDetails(rc){const d=document.createElement('div');d.className='rcd';d.id='rcd-'+rc.id;(rc.d||[]).forEach(t=>{const l=document.createElement('div');l.textContent=String(t);d.appendChild(l)});return d}
function rcRefresh(id){const rc=RC.get(id);if(!rc)return false;const els=[...document.querySelectorAll(`#log .rc[data-rcid="${id}"]`)];els.forEach(el=>{el.innerHTML=rcSum(rc)+` <span class=rcx aria-hidden=true>${el.getAttribute('aria-expanded')==='true'?'[-]':'[+]'}</span>`;el.className='rc '+safeT(rc.o);if(el.getAttribute('aria-expanded')==='true'){const o=el.nextElementSibling;if(o&&o.classList.contains('rcd'))o.replaceWith(rcDetails(rc))}});return els.length>0}
function rcToggle(el){const rc=RC.get(el.dataset.rcid);if(!rc)return;const open=el.getAttribute('aria-expanded')==='true',nx=el.nextElementSibling;if(open){if(nx&&nx.classList.contains('rcd'))nx.remove();el.setAttribute('aria-expanded','false')}else{{const dd=rcDetails(rc);el.after(dd);try{dd.scrollIntoView({block:'nearest'})}catch(e){}}el.setAttribute('aria-expanded','true');el.setAttribute('aria-controls','rcd-'+rc.id)}const x=el.querySelector('.rcx');if(x)x.textContent=open?'[+]':'[-]';try{audioEvent(open?'panelClose':'panelOpen')}catch(e){}}
function rcEmit(rc,up){RC.set(rc.id,rc);if(up){rcRefresh(rc.id)}else say(rcHtml(rc),rc.o);try{if(typeof window.mpCard==='function')window.mpCard(rc,!!up)}catch(e){}}
/* remote cards arrive as data (never HTML); every string is escaped on render */
function rcRemote(d,actor,color,unit){if(!d||typeof d!=='object'||!/^rc[a-z0-9]{1,20}$/.test(d.id||''))return'';const s=(v,n)=>String(v==null?'':v).slice(0,n);
 const rc={id:d.id,u:s(actor,40),c:colOk(color),f:s(d.f||unit,80),a:s(d.a,160),r:s(d.r,80),o:safeT(d.o),d:Array.isArray(d.d)?d.d.slice(0,40).map(x=>s(x,300)):[]};
 const had=RC.has(rc.id);RC.set(rc.id,rc);if(d.up&&had&&rcRefresh(rc.id))return null;return rcHtml(rc)}
const _isCrit=(tot,sl)=>tot<=4||(tot==5&&sl>=15)||(tot==6&&sl>=16)?'CRIT SUCCESS':(tot==18||(tot==17&&sl<=15)||tot-sl>=10)?'CRIT FAIL':'';
function rollCard53(label,spec,r,tot,sl,ok,marg,res){const q=spec.split('|'),crit=_isCrit(tot,sl),parts=String(label).split(' :: ');let a,rr,k=-1,w=null;
 if(q[0]=='atk'){k=+q[2];w=weapons()[k];a=w?w.n:parts.slice(1).join(' ');const h=(S.hitq||{})[k]||{};rr=ok?(h.n||1)+' HIT'+(h.n==1?'':'S'):'MISS'}
 else{a=parts.map(x=>x.replace(/\s*\((MOD|RETREAT|HEAT|ALL-OUT|DOUBLE)[^)]*\)/g,'')).filter(Boolean).join(' \u00b7 ');const m=/(\d+) DEGREES? OF (SUCCESS|FAILURE)/.exec(res);const d=m?+m[1]:marg;rr=ok?'+'+d+' DoS':'-'+d+' DoF'}
 if(crit)rr=crit+' \u00b7 '+rr;
 const det=['ROLL: '+String(label).replace(/<[^>]*>/g,''),'3d6 ['+r.join(', ')+'] = '+tot+' vs SL '+sl+(crit?' ('+crit+')':''),(ok?'SUCCESS':'FAILURE')+' BY '+marg];
 String(res).replace(/^(SUCCESS|FAILURE) by \d+( :: )?/,'').split(' :: ').filter(Boolean).forEach(x=>det.push(x.replace(/<[^>]*>/g,'')));
 const rc=rcNew(a,rr,ok?'ok':'bad',det);if(q[0]=='atk'&&w&&S.hitq&&S.hitq[k])S.hitq=Object.assign({},S.hitq,{[k]:Object.assign({},S.hitq[k],{c:rc.id})});rcEmit(rc)}
function dmgCard53(w,cid,n,mult,sb,atk,why){const tot=atk.reduce((s,a)=>s+a.total,0),lines=atk.map((a,j)=>'DAMAGE'+(atk.length>1?' '+(j+1)+'/'+atk.length:'')+': '+n+'d6'+(mult>1?' x '+mult:'')+' = ['+a.rolls.join(', ')+'] = '+a.sum+(sb?' +'+sb+' STRONG':'')+' -> '+a.total);
 if(atk.length>1)lines.push('TOTAL DAMAGE: '+tot);if(why)lines.unshift('DAMAGE ROLLS: '+String(why).replace(/<[^>]*>/g,''));
 const old=cid&&RC.get(cid);if(old){old.d=old.d.concat(lines);old.r=old.r.replace(/ \u00b7 DMG .*$/,'')+' \u00b7 DMG '+tot;rcEmit(old,true);return}
 rcEmit(rcNew(w.n+' DAMAGE',(atk.length>1?atk.length+' ROLLS \u00b7 ':'')+'DMG '+tot,'dim',lines))}
document.addEventListener('click',e=>{const el=e.target&&e.target.closest&&e.target.closest('#log .rc');if(el){e.stopPropagation();rcToggle(el)}},true);
document.addEventListener('keydown',e=>{const el=document.activeElement;if(el&&el.classList&&el.classList.contains('rc')&&el.closest('#log')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation();rcToggle(el)}},true);

</script>
