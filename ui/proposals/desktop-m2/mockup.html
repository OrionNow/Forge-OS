<style>

button{font:inherit}

/* ---------- presets: one live host per panel type ---------- */
function blank(){return {v:2,snap:true,grid:8,seq:0,top:10,focus:null,live:"MSH-01",seen:{"ICR-07":"15:42","HVC-03":"15:18"},wins:[]}}
function preset(name){S=blank();const g=r3(132/AW()),rest=1-g;
 if(name==="trio"){const g2=r3(46/AW()),c=(1-g2)/3;nw({k:"roster",r:"rail",x:0,y:0,w:0,h:1,P:["roster"]});
  ["MSH-01","ICR-07","HVC-03"].forEach((m,i)=>nw({k:"doll",mech:m,acc:i,mode:"lr",x:r3(g2+c*i),y:0,w:r3(c-.004),h:.6,P:["doll","bus"]}));
  nw({k:"float",mech:"@live",mode:"tabs",x:g2,y:.61,w:r3(c-.004),h:.39,P:["impact","skills","rolls"]});
  nw({k:"sheet",mech:"@live",mode:"row",x:r3(g2+c),y:.61,w:r3(c-.004),h:.39,P:["frame","arms"]});
  nw({k:"console",x:r3(g2+2*c),y:.61,w:r3(c-.004),h:.39,P:["log"]});return}
 if(name==="table"){const g2=r3(46/AW()),r2=1-g2;nw({k:"roster",r:"rail",x:0,y:0,w:0,h:1,P:["roster"]});
  nw({k:"doll",mech:"MSH-01",acc:0,mode:"lr",x:g2,y:0,w:r3(r2*.72-.004),h:.64,P:["doll","bus","impact"]});
  nw({k:"float",mech:"@live",mode:"row",x:g2,y:.65,w:r3(r2*.72-.004),h:.35,P:["skills","rolls","arms"]});
  nw({k:"console",x:r3(g2+r2*.72),y:0,w:r3(r2*.28),h:1,P:["log"]});return}
 nw({k:"roster",r:"compact",x:0,y:0,w:0,h:1,P:["roster"]});
 nw({k:"doll",mech:"MSH-01",acc:0,mode:"lr",x:g,y:0,w:r3(rest*.38-.004),h:.6,P:["doll","bus"]});
 nw({k:"doll",mech:"ICR-07",acc:1,mode:"lr",x:r3(g+rest*.38),y:0,w:r3(rest*.34-.004),h:.6,P:["doll","bus"]});
 nw({k:"float",mech:"@live",mode:"row",x:g,y:.61,w:r3(rest*.72-.004),h:.39,P:["impact","skills","rolls"]});
 nw({k:"sheet",mech:"@live",mode:"col",x:r3(g+rest*.72),y:0,w:r3(rest*.28),h:.55,P:["frame","arms"]});

/* ---------- sanitize: run on boot and on every slot load (Ryuji 8, Misaki 5) ---------- */
function sanitize(L){
 if(!L||typeof L!=="object"||L.v!==2||!Array.isArray(L.wins))return {ok:false,why:L&&L.v>2?"FUTURE VERSION v"+L.v:"CORRUPT LAYOUT"};
 const o=blank();o.snap=L.snap!==false;o.seen={};o.live=MECHS[L.live]?L.live:null;
 if(L.seen&&typeof L.seen==="object")for(const k in L.seen)if(MECHS[k]&&typeof L.seen[k]==="string")o.seen[k]=L.seen[k].slice(0,5);
 let drop=0,blankd=0;const one={console:0,roster:0};S=o;
 for(const w of L.wins){
  if(!w||typeof w!=="object"||!KINDS.includes(w.k)){drop++;continue}
  if(one[w.k]!==undefined&&one[w.k]++){drop++;continue}
  let mech=null;
  if(w.k==="doll"){if(!MECHS[w.mech]){drop++;continue}mech=w.mech}
  else if(w.mech!=null){if(w.mech==="@live"||MECHS[w.mech])mech=w.mech;else{mech="@live";blankd++}}
  const types=[];(Array.isArray(w.P)?w.P:[]).forEach(p=>{const t=p&&p.t;if(PT[t]&&!types.includes(t))types.push(t)});
  if(w.k==="doll"&&!types.includes("doll"))types.unshift("doll");
  if(w.k==="console"&&!types.includes("log"))types.unshift("log");
  if(!types.length){drop++;continue}
  if(!mech&&types.some(t=>PT[t].m))mech="@live";
  const h=clamp(num(w.h,.4),.05,1),y=clamp(num(w.y,0),0,1-h);
  const n=nw({k:w.k,mech,mode:MODES.includes(w.mode)?w.mode:"col",act:clamp(num(w.act,0)|0,0,types.length-1),x:clamp(num(w.x,0),0,.98),y,w:clamp(num(w.w,.3),.05,1),h,
   z:0,pin:!!w.pin,col:!!w.col,min:!!w.min,max:!!w.max,P:types});
  if(w.k==="doll"){const used=S.wins.filter(x=>x!==n&&x.k==="doll").map(x=>x.acc);n.acc=Number.isInteger(w.acc)&&!used.includes(w.acc)?w.acc:[0,1,2,3,4].find(a=>!used.includes(a))||0}
  if(w.k==="roster")n.r=RW[w.r]?w.r:"compact";
 }
 // z order kept relative, renormalised below 800 (pinned add 900, still < 1000)
 S.wins.forEach((w,i)=>{w.z=10+i});S.top=10+S.wins.length;
 if(!S.wins.some(w=>w.k==="doll")){nw({k:"doll",mech:o.live||"MSH-01",acc:0,mode:"lr",x:.1,y:0,w:.4,h:.6,P:["doll","bus"]})}
 if(!S.wins.some(w=>w.k==="console")){nw({k:"console",x:.6,y:.55,w:.4,h:.45,P:["log"]})}
 if(!o.live||!MECHS[o.live])o.live=S.wins.find(w=>w.k==="doll").mech;
 const res=S;S=null;return {ok:true,L:res,drop,blankd}}

function persist(){if(hold)return;try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),ms||1800)}

/* ---------- binding: a window is fixed to one mech, or LINKED to the live doll ---------- */
function mechOf(w){if(!w)return null;return w.mech==="@live"?S.live:w.mech}
function dollFor(m){return S.wins.find(x=>x.k==="doll"&&x.mech===m)}
function accOf(w){if(!w)return null;if(w.k==="doll")return ACC[(w.acc||0)%ACC.length];const m=mechOf(w);const d=m&&dollFor(m);return d?ACC[(d.acc||0)%ACC.length]:null}
const bound=w=>w.P.some(p=>PT[p.t].m);
/* single-instance rule (Ryuji 6, Misaki 1): one live host per panel type, and only for the live mech */
function liveHost(t){for(const w of S.wins){if(mechOf(w)!==S.live)continue;const p=w.P.find(p=>p.t===t);if(p)return {w,p}}return null}
function pstate(w,p){if(!PT[p.t].m)return "free";const m=mechOf(w);if(m===S.live){const h=liveHost(p.t);return h&&h.p.id===p.id?"live":"copy"}return S.seen[m]?"cache":"none"}

 const p=(k,pts)=>`<polygon points="${pts}" fill="${C(k)}" fill-opacity=".14" stroke="${C(k)}" stroke-width="1.3"/>`;
 return `<svg viewBox="0 0 120 160" aria-hidden="true">${p("hd","50,6 70,6 73,12 70,20 50,20 47,12")}${p("co","38,24 82,24 89,40 80,72 40,72 31,40")}${p("cc","60,33 68,38 68,48 60,53 52,48 52,38")}${p("ut","44,75 76,75 78,83 42,83")}${p("ra","15,28 34,26 36,60 31,88 18,86 13,50")}${p("la","105,28 86,26 84,60 89,88 102,86 107,50")}${p("rl","40,87 58,87 56,124 55,154 39,154 38,124")}${p("ll","80,87 62,87 64,124 65,154 81,154 82,124")}<g stroke="var(--acc)" stroke-opacity=".35" fill="none"><path d="M44 30h32M44 66h32M60 24v-4"/></g></svg>`}

  return `<div class="cmp ${c.st[1]}" data-menu="loc:${k}"><b>${n}</b> <span class="${c.st[1]}">[${c.st[0]}]</span><br><span class="v">${c.cur}/${c.mx}</span><span class="dim"> HP DR${M.dr[0]}</span><div class="bar"><i style="width:${c.r*100}%"></i></div></div>`};
 const L=CL.map(row).join(""),R=CR.map(row).join(""),ig=Math.round(tc/tm*100),st=ig>=100?["NOMINAL","ok"]:ig>=60?["DAMAGED","dm"]:["CRITICAL","cr"];
 return `<div class="dh"><span class="dim">${M.f} :: BASE HP ${M.hp}</span><span id="sitsum">STATUS <b class="${st[1]} glow">${st[0]}</b> INTEGRITY <b class="glow">${ig}%</b></span><span>ISB LINK <b id="sync" class="ok">[LOCAL]</b></span></div>

function busP(M){const used=M.W.reduce((a,w)=>a+w[1],0);const ep=`<div class="gauge" id="tiers"><div class="gl"><span class="lb">EP BUS</span><b class="${used>M.ep?"cr":"ok"} glow">${used}/${M.ep}</b></div><div class="bar seg" style="--s:${100/M.ep}%;color:var(--acc)"><i style="width:${Math.min(1,used/M.ep)*100}%"></i></div></div>`;
 const h=M.heat?(()=>{const [n,c]=M.heat,z=n>=c?["REDLINE","cr"]:n>=c/2?["DANGER ZONE","dm"]:["","ok"];return `<div class="gauge"><div class="gl"><span class="lb">HEAT</span><b class="${z[1]} glow">${n}/${c} ${z[0]}</b></div><div class="bar heat" style="color:var(--${z[1]==="ok"?"ok":z[1]==="dm"?"dmg":"crit"})"><i style="width:${n/c*100}%"></i></div></div>`})():`<div class="gauge dim">HEAT —  no heat track on this frame</div>`;

function content(t,m,w){const M=MECHS[m];if(PT[t].m&&!M)return `<div class="nyv">NO MECH</div>`;
 return t==="doll"?dollP(M):t==="bus"?busP(M):t==="impact"?impactP():t==="skills"?skillsP():t==="rolls"?rollsP():t==="arms"?armsP(M):t==="frame"?frameP(M):t==="log"?logP():rosterP(w)}
window.mockApply=()=>toast("LIVE INPUT // acts on the live sheet ("+S.live+")");
/* mirror cache hygiene (Ryuji 3, Misaki 2): strip id, for, name, on-handlers, data-menu and data-item; disable controls; mount inert */
function strip(html){const t=document.createElement("template");t.innerHTML=html;
 t.content.querySelectorAll("*").forEach(e=>{[...e.attributes].forEach(a=>{const n=a.name;if(n==="id"||n==="for"||n==="name"||n==="data-menu"||n==="data-item"||n.startsWith("on"))e.removeAttribute(n)});
  if(/^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(e.tagName)){e.setAttribute("disabled","");e.setAttribute("tabindex","-1")}});return t.innerHTML}
function panelBody(w,p){const m=mechOf(w),st=pstate(w,p);
 if(st==="live"||st==="free")return content(p.t,m,w);
 if(st==="none")return `<div class="nyv">◇ ${m} // NOT YET VIEWED<br>MAKE LIVE TO LOAD</div>`;
 const h=liveHost(p.t);
 const bar=st==="copy"?`<div class="mirbar">◇ COPY · LIVE IN ${esc(winTitle(h.w))}<span class="sp"></span><button class="c" data-a="goto" data-w="${h.w.id}">GO</button></div>`
  :`<div class="mirbar">◇ MIRROR · ${S.seen[m]} · MAKE LIVE TO EDIT<span class="sp"></span><button class="c" data-a="live" data-m="${m}" title="Make ${m} the live sheet (shGo)">◆ MAKE LIVE</button></div>`;

const cb=(a,t,l,on,x)=>`<button class="c${on?" on":""}${x?" "+x:""}" data-a="${a}" title="${t}" aria-label="${t}">${l}</button>`;
function titleHTML(w,m){let lead="",sel="",tt;const live=m===S.live;
 if(w.k==="doll"){lead=`<span class="dot"></span>`;
  sel=`<select data-a="mech" ${live?'disabled title="This is the live doll: make another doll live first"':'title="Mech shown in this doll window"'} aria-label="Mech">${Object.keys(MECHS).map(k=>`<option value="${k}"${k===w.mech?" selected":""}>${k}</option>`).join("")}</select>`;
  lead+=live?`<span class="tag live" title="Live sheet (S.cur). Inputs act here.">◆ LIVE</span>`:"";
  tt=`${MECHS[m].n.replace(m+" ","")} // PAPER DOLL`;
 } else if(bound(w)){sel=`<select data-a="mech" title="LINKED follows the live doll, or lock this window to one mech" aria-label="Mech binding"><option value="@live"${w.mech==="@live"?" selected":""}>⛓ LINKED</option>${Object.keys(MECHS).map(k=>`<option value="${k}"${k===w.mech?" selected":""}>${k}</option>`).join("")}</select>`;
  tt=w.k==="float"?w.P.map(p=>PT[p.t].n.split(" //")[0]).join(" + "):KT[w.k];
 } else tt=KT[w.k];
 const b=[];
 if(w.k==="doll"&&!live)b.push(cb("live",`Make ${m} the live sheet (calls shGo). Focus and clicks never do this.`,"◆ MAKE LIVE",0,"mk"));
 if(w.k==="roster")b.push(cb("rail","Width: compact / icon rail / full","◧"));
 if(w.k==="float")b.push(cb("home","Re-dock these panels to their home window","⇲"));
 if(w.k!=="roster")b.push(cb("pin",w.pin?"Unpin":"Pin: lock position and size, keep above unpinned windows","⌖",w.pin));
 if(w.k!=="roster")b.push(cb("col",w.col?"Expand":"Collapse to title strip",w.col?"+":"–"));
 b.push(cb("min","Minimize to the taskbar shelf","_"));
 if(w.k!=="console"&&w.k!=="roster")b.push(cb("close","Close window","✕"));
 return `<div class="wt">${lead}${sel}<span class="tt" title="${esc(tt)}">${esc(tt)}</span>${b.join("")}</div>`}
function pan(p,w,hdr){return `<div class="pn" data-p="${p.id}" data-s="${pstate(w,p)}">${hdr?`<div class="ph" data-tear="${p.id}" title="Drag out of the window, or press ⇱, to tear off"><span>${PT[p.t].n}</span><span class="sp"></span><button class="c" data-a="tear" data-p="${p.id}" title="Tear off into its own window" aria-label="Tear off ${PT[p.t].n}">⇱</button></div>`:""}<div class="pb">${panelBody(w,p)}</div></div>`}
function bodyHTML(w){if(w.col)return `<div class="wb"></div>`;const ps=w.P;

 if(ps.length===1)return `<div class="wb">${pan(ps[0],w,false)}</div>`;
 if(w.mode==="tabs"){const a=clamp(w.act||0,0,ps.length-1);return `<div class="wb m-tabs"><div class="tabsr" role="tablist">${ps.map((p,i)=>`<button class="tab${i===a?" on":""}" role="tab" aria-selected="${i===a}" data-a="tab" data-i="${i}">${PT[p.t].n.split(" //")[0]}</button>`).join("")}<span style="flex:1"></span><button class="c" data-a="tear" data-p="${ps[a].id}" title="Tear off this tab">⇱</button></div>${pan(ps[a],w,false)}</div>`}
 if(w.mode==="lr")return `<div class="wb m-lr">${pan(ps[0],w,true)}<div class="lc">${ps.slice(1).map(p=>pan(p,w,true)).join("")}</div></div>`;
 return `<div class="wb m-${w.mode}">${ps.map(p=>pan(p,w,true)).join("")}</div>`}
/* clamp: windows always fit and their bottoms stay on screen (Misaki should-fix) */
function place(e,w){const A=AW(),H=AH();let ww=w.k==="roster"?RW[w.r||"compact"]:Math.max(160,Math.round(w.w*A));ww=Math.min(ww,A);
 const hh=clamp(Math.round(w.h*H),60,H);e.style.width=ww+"px";e.style.height=w.col?"":hh+"px";
 e.style.left=clamp(Math.round(w.x*A),0,Math.max(0,A-ww))+"px";e.style.top=clamp(Math.round(w.y*H),0,Math.max(0,H-(w.col?24:hh)))+"px";
 e.style.zIndex=(w.pin?900:0)+w.z}

const OWN={"MSH-01":"TALON-2","ICR-07":"KESTREL","HVC-03":"RAVEN-6","LGT-05":"WREN-LEAD"};
function barHost(){return dollFor(S.live)||S.wins.find(x=>x.k==="doll")}
function tabStrip(){return `<div id="bar" class="stabs" role="tablist" aria-label="Sheet tabs">${Object.keys(MECHS).map(k=>`<button class="stab${k===S.live?" on":""}" data-a="stab" data-m="${k}" role="tab" aria-selected="${k===S.live}" title="${k===S.live?"Live sheet":"Switch the live sheet to "+k+" (shGo, explicit)"}">${k} <span class="ow">· ${OWN[k]}</span></button>`).join("")}<button class="stab" data-a="stab" title="[+ LOAD SHEET] (inert in the mockup)">[+ LOAD SHEET]</button></div>`}
function renderWin(w){let e=EL(w.id);if(!e){e=document.createElement("section");e.dataset.id=w.id;e.setAttribute("role","region");desk.appendChild(e);bind(e)}
 const m=mechOf(w),acc=accOf(w);
 // keep focus + caret across a re-render/harvest (Misaki should-fix)
 const ae=document.activeElement,keep=ae&&e.contains(ae)&&ae.id?{id:ae.id,v:ae.value,s:ae.selectionStart,en:ae.selectionEnd}:null;
 e.className="win"+(acc?" acc":"")+(w.id===S.focus?" focus":"")+(w.col?" col":"")+(w.min?" min":"")+(w.max?" max":"")+(w.pin?" pin":"")+(w.k==="roster"&&w.r==="rail"?" rail":"")+(w.k==="doll"&&m===S.live?" live":"");
 e.style.setProperty("--acc",acc||"var(--line)");e.dataset.k=w.k;e.dataset.m=m||"";e.setAttribute("aria-label",winTitle(w));
 e.innerHTML=titleHTML(w,m)+(w===barHost()&&!w.col?tabStrip():"")+bodyHTML(w);place(e,w);
 if(keep){const n=document.getElementById(keep.id);if(n&&e.contains(n)){n.value=keep.v;n.focus();try{n.setSelectionRange(keep.s,keep.en)}catch(x){}}}}
function render(){desk.querySelectorAll(".win").forEach(e=>{if(!W(e.dataset.id))e.remove()});S.wins.forEach(renderWin);paintBar();persist()}

/* ---------- focus never promotes (Ryuji 4, Misaki 3) ---------- */
function focusWin(id){const w=W(id);if(!w)return;S.focus=id;
 if(w.z!==S.top){w.z=++S.top;if(S.top>790){S.top=10;S.wins.slice().sort((a,b)=>a.z-b.z).forEach(x=>x.z=++S.top)}}
 desk.querySelectorAll(".win").forEach(e=>{e.classList.toggle("focus",e.dataset.id===id);const x=W(e.dataset.id);if(x)e.style.zIndex=(x.pin?900:0)+x.z});paintBar();persist()}
function makeLive(m){if(!MECHS[m]||m===S.live)return;S.seen[S.live]=hhmm();S.live=m;render();toast("◆ LIVE SHEET → "+m+"  (shGo; mirrors keep their last cache)")}
function closeWin(id){S.wins=S.wins.filter(x=>x.id!==id);if(!S.wins.some(w=>w.k==="doll"))nw({k:"doll",mech:S.live,acc:0,mode:"lr",x:.1,y:0,w:.4,h:.6,P:["doll","bus"]});if(S.focus===id)S.focus=null;render()}
function act(id,a,el){const w=W(id);if(!w)return;
 if(a==="live")return makeLive(el.dataset.m||mechOf(w));
 if(a==="stab"){if(el.dataset.m)makeLive(el.dataset.m);return}
 if(a==="goto"){const t=W(el.dataset.w);if(t){t.min=false;renderWin(t);focusWin(t.id)}return}
 if(a==="pin"){w.pin=!w.pin;toast(w.pin?"PINNED // position locked":"UNPINNED")}
 else if(a==="col")w.col=!w.col;
 else if(a==="min"){w.min=true;if(S.focus===id)S.focus=null}
 else if(a==="close")return closeWin(id);
 else if(a==="rail"){w.r={compact:"rail",rail:"full",full:"compact"}[w.r||"compact"];toast("USERS // "+w.r.toUpperCase())}
 else if(a==="tab")w.act=+el.dataset.i;
 else if(a==="tear")return tear(id,el.dataset.p);
 else if(a==="home")return dockHome(id);
 renderWin(w);paintBar();persist()}
function restore(id){const w=W(id);w.min=false;w.col=false;renderWin(w);focusWin(id)}

/* ---------- tear-off / dock (bindings: a torn panel keeps its window's binding) ---------- */
function tear(id,pid,at){const w=W(id);const i=w.P.findIndex(p=>p.id===pid);if(i<0)return;const [p]=w.P.splice(i,1);w.act=0;
 const e=EL(id),A=AW(),H=AH();const x=at?at.x:e.offsetLeft+28,y=at?at.y:e.offsetTop+36;
 const f=nw({k:"float",mech:PT[p.t].m?(w.mech||"@live"):null,mode:"col",x:r3(clamp(x,0,A-220)/A),y:r3(clamp(y,0,H-120)/H),w:r3(Math.max(240,Math.min(360,e.offsetWidth*.6))/A),h:r3(Math.min(.42,Math.max(.22,(e.offsetHeight*.55)/H))),P:[p]});
 if(!p.home)p.home=id;if(!w.P.length&&w.k==="float")S.wins=S.wins.filter(x=>x!==w);if(w.k==="doll"&&!w.P.some(q=>q.t==="doll"))w.P.unshift({id:"p"+(++S.seq),t:"doll",home:id});
 render();focusWin(f.id);toast("TORN OFF // "+PT[p.t].n)}
function dockInto(src,dst){const s=W(src),d=W(dst);if(!s||!d||s===d)return;
 s.P.forEach(p=>{if(!d.P.some(q=>q.t===p.t)){p.home=dst;d.P.push(p)}});if(!d.mech&&bound(d))d.mech="@live";
 S.wins=S.wins.filter(x=>x!==s);d.min=false;d.col=false;if(S.focus===src)S.focus=dst;render();focusWin(dst);toast("DOCKED → "+winTitle(d))}
function dockHome(id){const w=W(id);let moved=0;w.P.slice().forEach(p=>{const h=W(p.home);if(h&&h!==w&&!h.P.some(q=>q.t===p.t)){h.P.push(p);w.P.splice(w.P.indexOf(p),1);moved++;h.min=false}});
 if(!moved){toast("NO HOME HOST // drag the title onto a window's title strip");return}
 if(!w.P.length)S.wins=S.wins.filter(x=>x!==w);render();toast("RE-DOCKED // "+moved+" panel"+(moved>1?"s":""))}

/* ---------- drag, simple snap, resize ---------- */
function snapTo(e,L,T){const A=AW(),H=AH(),ww=e.offsetWidth,hh=e.offsetHeight,G=S.grid,D=10;
 if(S.snap){L=Math.round(L/G)*G;T=Math.round(T/G)*G;
  desk.querySelectorAll(".win:not(.min)").forEach(o=>{if(o===e)return;const l=o.offsetLeft,t=o.offsetTop,r=l+o.offsetWidth,b=t+o.offsetHeight;
   if(T<b+D&&T+hh>t-D){if(Math.abs(L-(r+4))<D)L=r+4;if(Math.abs(L+ww-(l-4))<D)L=l-4-ww;if(Math.abs(L-l)<D)L=l}
   if(L<r+D&&L+ww>l-D){if(Math.abs(T-(b+4))<D)T=b+4;if(Math.abs(T+hh-(t-4))<D)T=t-4-hh;if(Math.abs(T-t)<D)T=t}})}
 if(L<12)L=0;if(L+ww>A-12)L=A-ww;if(T<12)T=0;return [clamp(L,0,Math.max(0,A-ww)),clamp(T,0,Math.max(0,H-hh))]}
function commit(id){const w=W(id),e=EL(id);if(!w||!e||w.max)return;const A=AW(),H=AH();w.x=r3(e.offsetLeft/A);w.y=r3(e.offsetTop/H);
 if(w.k!=="roster")w.w=r3(e.offsetWidth/A);if(!w.col)w.h=r3(Math.min(1,e.offsetHeight/H));persist()}
function dragStart(ev,id,t){const w=W(id),e=EL(id);if(ev.button!==0||w.pin||w.max)return;ev.preventDefault();
 const x0=ev.clientX,y0=ev.clientY,l0=e.offsetLeft,t0=e.offsetTop;let tgt=null,moved=false;t.setPointerCapture(ev.pointerId);
 const nodock=k=>k==="roster"||k==="console";
 const mv=v=>{const dx=v.clientX-x0,dy=v.clientY-y0;if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;if(!moved){moved=true;desk.classList.add("dragging");e.classList.add("drag")}
  e.style.left=l0+dx+"px";e.style.top=t0+dy+"px";
  const hit=document.elementsFromPoint(v.clientX,v.clientY).map(n=>n.closest&&n.closest(".wt")).find(n=>n&&n.parentNode!==e);let nt=hit?hit.parentNode:null;
  if(nt&&(nodock(w.k)||nodock(nt.dataset.k)))nt=null;if(nt!==tgt){if(tgt)tgt.classList.remove("dockhint");tgt=nt;if(tgt)tgt.classList.add("dockhint")}};
 const up=()=>{t.removeEventListener("pointermove",mv);t.removeEventListener("pointerup",up);t.removeEventListener("pointercancel",up);desk.classList.remove("dragging");e.classList.remove("drag");
  if(!moved)return;if(tgt){tgt.classList.remove("dockhint");return dockInto(id,tgt.dataset.id)}
  const [L,T]=snapTo(e,e.offsetLeft,e.offsetTop);e.style.left=L+"px";e.style.top=T+"px";commit(id)};
 t.addEventListener("pointermove",mv);t.addEventListener("pointerup",up);t.addEventListener("pointercancel",up)}
function tearDrag(ev,id,pid){if(ev.button!==0||ev.target.closest("button"))return;const e=EL(id),t=ev.target.closest(".ph");t.setPointerCapture(ev.pointerId);
 const mv=v=>{const r=e.getBoundingClientRect();e.classList.toggle("tearing",v.clientX<r.left||v.clientX>r.right||v.clientY<r.top||v.clientY>r.bottom)};
 const up=v=>{t.removeEventListener("pointermove",mv);t.removeEventListener("pointerup",up);const out=e.classList.contains("tearing");e.classList.remove("tearing");
  if(out){const d=desk.getBoundingClientRect();tear(id,pid,{x:v.clientX-d.left-20,y:v.clientY-d.top-10})}};
 t.addEventListener("pointermove",mv);t.addEventListener("pointerup",up)}
function bind(e){const id=e.dataset.id;
 e.addEventListener("pointerdown",ev=>{if(S.focus!==id)focusWin(id);const wt=ev.target.closest(".wt");
  if(wt&&!ev.target.closest("button,select"))dragStart(ev,id,wt);
  const ph=ev.target.closest(".ph");if(ph)tearDrag(ev,id,ph.dataset.tear)},true);
 e.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;ev.stopPropagation();act(id,b.dataset.a,b)});
 e.addEventListener("change",ev=>{if(ev.target.dataset.a!=="mech")return;const w=W(id);const v=ev.target.value;
  if(w.k==="doll"&&w.mech===S.live)return;w.mech=v;render();toast("BOUND → "+(v==="@live"?"LINKED (live doll)":v))});
 e.addEventListener("dblclick",ev=>{if(ev.target.closest(".wt")&&!ev.target.closest("button,select")){const w=W(id);if(w.pin)return;w.max=!w.max;w.col=false;renderWin(w);persist()}});
 e.addEventListener("pointerup",()=>{const w=W(id);if(!w||w.col||w.max||w.pin)return;const A=AW(),H=AH();
  if((Math.abs(w.w*A-e.offsetWidth)>2&&w.k!=="roster")||Math.abs(w.h*H-e.offsetHeight)>2){if(S.snap){e.style.width=Math.round(e.offsetWidth/S.grid)*S.grid+"px";e.style.height=Math.round(e.offsetHeight/S.grid)*S.grid+"px"}commit(id)}})}

/* ---------- taskbar: chips show state + mech + type (◆MSH·DOLL, ◇ICR·DOLL) ---------- */
function chipT(w){const m=mechOf(w),s=m?(m===S.live?"◆":"◇"):"",ms=m?m.slice(0,3)+"·":"";
 return s+ms+(w.k==="doll"?"DOLL":w.k==="float"?w.P.map(p=>PT[p.t].a).join("+"):w.k==="sheet"?"SHEET":w.k==="console"?"CONSOLE":"USERS")}
function paintBar(){$("#chips").innerHTML=S.wins.map(w=>{const a=accOf(w),g=w.min?"_":w.pin?"⌖":w.col?"–":"●";
 return `<button class="chip${w.min?" min":""}${w.id===S.focus?" focus":""}" data-id="${w.id}" style="${a?"--acc:"+a:""}" title="${esc(winTitle(w))} — click: ${w.min?"restore":w.id===S.focus?"minimize":"focus"}"><span class="g">${g}</span><span class="n">${esc(chipT(w))}</span></button>`}).join("");
 $("#slots").innerHTML=[1,2,3,4,5].map(n=>{const s=slots[n];return `<button class="slot${s?" full":""}${n===sel?" sel":""}" data-n="${n}" aria-pressed="${n===sel}" title="${s&&s.saved?`SLOT ${n} // ${esc(s.name||"")} // ${String(s.saved).slice(0,16).replace("T"," ")} — double-click to load`:`SLOT ${n} // empty`}">${n}</button>`}).join("");
 $("#snapBtn").setAttribute("aria-pressed",S.snap?"true":"false")}
$("#chips").addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;const w=W(b.dataset.id);
 if(w.min)restore(w.id);else if(w.id===S.focus){w.min=true;S.focus=null;renderWin(w);paintBar();persist()}else{if(w.col){w.col=false;renderWin(w)}focusWin(w.id)}});
$("#slots").addEventListener("click",ev=>{const b=ev.target.closest(".slot");if(!b)return;sel=+b.dataset.n;paintBar()});
$("#slots").addEventListener("dblclick",ev=>{const b=ev.target.closest(".slot");if(b)loadSlot(+b.dataset.n)});
function saveSlots(){try{localStorage.setItem(SLK,JSON.stringify(slots))}catch(e){}}
function saveSlot(n,quiet){const L=JSON.parse(JSON.stringify(S));slots[n]={v:2,name:`${L.wins.filter(w=>w.k==="doll").length} DOLL · ${L.wins.length} WIN`,saved:new Date().toISOString(),area:{w:AW(),h:AH()},layout:L};saveSlots();sel=n;paintBar();
 const b=$(`.slot[data-n="${n}"]`);if(b)b.classList.add("flash");if(!quiet)toast("LAYOUT SAVED // SLOT "+n)}
function loadSlot(n){const s=slots[n];if(!s||!s.layout){toast("SLOT "+n+" EMPTY");return}
 const r=sanitize(s.layout);if(!r.ok){toast("SLOT "+n+" REJECTED // "+r.why+" // layout unchanged");return}
 S=r.L;sel=n;hold=false;desk.querySelectorAll(".win").forEach(e=>e.remove());render();
 toast("LAYOUT LOADED // SLOT "+n+(r.drop?` // ${r.drop} window(s) dropped`:"")+(r.blankd?` // ${r.blankd} relinked (mech missing)`:""),2600)}
$("#saveBtn").onclick=()=>saveSlot(sel);$("#loadBtn").onclick=()=>loadSlot(sel);
$("#defBtn").onclick=()=>{const b=$("#defBtn");
 if(undoS&&Date.now()<undoT){S=undoS;undoS=null;b.textContent="DEF";b.classList.remove("undo");desk.querySelectorAll(".win").forEach(e=>e.remove());render();toast("UNDO // previous layout back");return}
 undoS=JSON.parse(JSON.stringify(S));undoT=Date.now()+8000;hold=false;preset("def");desk.querySelectorAll(".win").forEach(e=>e.remove());render();
 b.textContent="UNDO";b.classList.add("undo");toast("DEFAULT LAYOUT // press UNDO within 8 s to go back",2600);
 setTimeout(()=>{if(Date.now()>=undoT){b.textContent="DEF";b.classList.remove("undo");undoS=null}},8100)};
$("#snapBtn").onclick=()=>{S.snap=!S.snap;paintBar();persist();toast(S.snap?"SNAP ON // 8px grid + edges":"SNAP OFF")};
$("#classicBtn").onclick=()=>toast("CLASSIC (real build): hostOut() returns #bar #con #sh #cb, every panel is emptied, then R()",2600);
document.querySelectorAll("#tb [data-t]").forEach(b=>b.onclick=()=>launch(b.dataset.t));
function launch(k){const A=AW();
 if(k==="doll"){const used=S.wins.filter(w=>w.k==="doll"),free=Object.keys(MECHS).find(m=>!used.some(w=>w.mech===m));
  if(!free){toast("EVERY MECH ALREADY HAS A DOLL WINDOW");return}
  let acc=0;while(used.some(w=>w.acc===acc))acc++;const n=used.length;
  const w=nw({k:"doll",mech:free,acc,mode:"lr",x:r3(.12+.03*n),y:r3(.04+.04*n),w:r3(Math.max(480,A*.32)/A),h:.58,P:["doll","bus"]});render();focusWin(w.id);toast("DOLL WINDOW // "+free+(S.seen[free]?" (mirror)":" (not yet viewed)"));return}
 const ex=S.wins.find(w=>w.k===k);if(ex){restore(ex.id);return}
 const D={sheet:{mech:"@live",P:["frame","arms"],x:.6,y:.05,w:.25,h:.5},console:{P:["log"],x:.6,y:.5,w:.3,h:.45},roster:{r:"compact",P:["roster"],x:0,y:0,w:0,h:.6}}[k];
 const w=nw(Object.assign({k},D));render();focusWin(w.id)}
$("#panBtn").onclick=ev=>{const p=$("#pop");if(p.classList.toggle("on")){
 p.innerHTML=`<div class="hdr">OPEN AS WINDOW // ⛓ LINKED (${S.live})</div>`+Object.keys(PT).filter(t=>PT[t].m).map(t=>{const h=liveHost(t);return `<button class="b" data-pt="${t}">${PT[t].n}${h?`  ·  live in ${esc(chipT(h.w))}`:""}</button>`}).join("");
 const r=ev.currentTarget.getBoundingClientRect();p.style.left=r.left+"px"}};
$("#pop").addEventListener("click",ev=>{const b=ev.target.closest("[data-pt]");if(!b)return;$("#pop").classList.remove("on");const t=b.dataset.pt,h=liveHost(t);
 if(h){h.w.min=false;renderWin(h.w);focusWin(h.w.id);toast(PT[t].n+" is already live in "+chipT(h.w)+" // one live host per panel");return}
 const f=nw({k:"float",mech:"@live",mode:"col",x:.35,y:.2,w:r3(300/AW()),h:.34,P:[t]});render();focusWin(f.id);toast("PANEL WINDOW // "+PT[t].n)});
document.addEventListener("pointerdown",ev=>{if(!ev.target.closest("#pop,#panBtn"))$("#pop").classList.remove("on")});
/* hotkeys avoid browser Alt+1..9 / F6: Ctrl+Alt+1..5 load, Ctrl+Alt+Shift+1..5 save, Ctrl+Alt+N new doll */
document.addEventListener("keydown",ev=>{if(!(ev.ctrlKey&&ev.altKey))return;const dg=/^Digit([1-5])$/.exec(ev.code);
 if(dg){ev.preventDefault();ev.shiftKey?saveSlot(+dg[1]):loadSlot(+dg[1]);return}
 if(ev.code==="KeyN"){ev.preventDefault();launch("doll")}});
window.addEventListener("resize",()=>S.wins.forEach(w=>{const e=EL(w.id);if(e)place(e,w)}));
setInterval(()=>{$("#clock").textContent=hhmm()},1000);

/* ---------- boot ---------- */
(function boot(){const q=new URLSearchParams(location.search);
 try{slots=JSON.parse(localStorage.getItem(SLK)||"{}")||{};if(typeof slots!=="object")slots={}}catch(e){slots={}}
 let msg="";
 if(q.get("preset"))preset(q.get("preset"));
 else{let raw=null;try{raw=localStorage.getItem(LSK)}catch(e){}
  if(raw==null)preset("def");
  else{let st=null;try{st=JSON.parse(raw)}catch(e){}const r=sanitize(st);
   if(r.ok)S=r.L;else{preset("def");hold=true;msg="STORED LAYOUT "+r.why+" // DEF loaded, store left untouched"}}}
 if(q.get("demo")==="slots"&&!Object.keys(slots).length){saveSlot(1,true);sel=1}
 render();$("#clock").textContent=hhmm();if(msg)toast(msg,3500)})();

</script>
</body>
